<div class="example-toolbar-container">
  <div ngToolbar class="example-toolbar" aria-label="Horizontal Toolbar Text Formatting Tools">
    <div class="example-group" aria-label="Undo and Redo options">
      <button toolbar-button>undo</button>
      <button toolbar-button>redo</button>
    </div>

    <div class="example-separator" role="separator"></div>

    <div class="example-group" aria-label="Text formatting options">
      <button toolbar-toggle-button>format_bold</button>
      <button toolbar-toggle-button>format_italic</button>
      <button toolbar-toggle-button>format_underlined</button>
    </div>

    <div class="example-separator" role="separator"></div>

    <combobox />

    <div class="example-separator" role="separator"></div>

    <div
      ngToolbarWidgetGroup
      role="radiogroup"
      class="example-group"
      aria-label="Alignment options"
    >
      <button toolbar-radio-button checked>format_align_left</button>
      <button toolbar-radio-button>format_align_center</button>
      <button toolbar-radio-button>format_align_right</button>
    </div>

    <div class="example-separator" role="separator"></div>

    <div ngToolbarWidgetGroup role="radiogroup" class="example-group" aria-label="List options">
      <button toolbar-radio-button checked>checklist</button>
      <button toolbar-radio-button>format_list_bulleted</button>
      <button toolbar-radio-button>format_list_numbered</button>
    </div>
  </div>
</div>
