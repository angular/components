<div class="example-toolbar-container">
  <div ngToolbar class="example-toolbar" aria-label="Rich text editor toolbar with select and combobox">
    <!-- Action buttons -->
    <div class="example-group" aria-label="History actions">
      <button toolbar-button aria-label="Undo">undo</button>
      <button toolbar-button aria-label="Redo">redo</button>
    </div>

    <div class="example-separator" role="separator"></div>

    <!-- Toggle buttons -->
    <div class="example-group" aria-label="Style toggles">
      <button toolbar-toggle-button aria-label="Bold">format_bold</button>
      <button toolbar-toggle-button aria-label="Italic">format_italic</button>
      <button toolbar-toggle-button aria-label="Underline">format_underlined</button>
    </div>

    <div class="example-separator" role="separator"></div>

    <!-- Custom ARIA Combobox -->
    <combobox />

    <div class="example-separator" role="separator"></div>

    <!-- Native Select element inside Toolbar -->
    <div class="example-group" style="align-items: center;">
      <label for="font-family-select" style="font-size: 0.8rem; margin-right: 4px;">Font:</label>
      <select
        id="font-family-select"
        ngToolbarWidget
        [(ngModel)]="selectedFont"
        style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--mat-sys-outline, #ccc); background: var(--mat-sys-surface, #fff); font-size: 0.85rem;"
      >
        <option value="sans-serif">Sans-Serif</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monospace</option>
        <option value="cursive">Cursive</option>
      </select>
    </div>

    <div class="example-separator" role="separator"></div>

    <!-- Native Spinbutton (input type=number) inside Toolbar -->
    <div class="example-group" style="align-items: center;">
      <label for="font-size-input" style="font-size: 0.8rem; margin-right: 4px;">Size:</label>
      <input
        id="font-size-input"
        ngToolbarWidget
        type="number"
        [(ngModel)]="fontSize"
        min="8"
        max="72"
        step="1"
        style="width: 4rem; padding: 4px; border-radius: 4px; border: 1px solid var(--mat-sys-outline, #ccc); font-size: 0.85rem;"
      />
    </div>

    <div class="example-separator" role="separator"></div>

    <!-- Alignment radio group -->
    <div
      ngToolbarWidgetGroup
      role="radiogroup"
      class="example-group"
      aria-label="Alignment options"
    >
      <button
        toolbar-radio-button
        [checked]="alignment() === 'align left'"
        (click)="alignment.set('align left')"
        aria-label="Align left"
      >format_align_left</button>
      <button
        toolbar-radio-button
        [checked]="alignment() === 'align center'"
        (click)="alignment.set('align center')"
        aria-label="Align center"
      >format_align_center</button>
      <button
        toolbar-radio-button
        [checked]="alignment() === 'align right'"
        (click)="alignment.set('align right')"
        aria-label="Align right"
      >format_align_right</button>
    </div>
  </div>

  <div style="margin-top: 12px; font-size: 0.85rem; color: var(--mat-sys-on-surface-variant, #666);">
    <p>Selected Font: <strong>{{ selectedFont() }}</strong> | Size: <strong>{{ fontSize() }}px</strong> | Alignment: <strong>{{ alignment() }}</strong></p>
  </div>
</div>
