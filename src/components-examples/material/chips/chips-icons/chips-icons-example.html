<mat-chip-set aria-label="Chip examples">
  <mat-chip>
    <mat-icon matChipLeadingIcon>flight</mat-icon>
    Flight
  </mat-chip>
  <mat-chip>
    <mat-icon matChipLeadingIcon>hotel</mat-icon>
    Hotel
    <mat-icon matChipTrailingIcon>star</mat-icon>
