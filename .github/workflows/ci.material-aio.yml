name: 'CI (material.angular.dev)'

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Execute Build
        run: pnpm -s build //docs/...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Execute Tests
        run: pnpm bazel test --test_tag_filters=-e2e,-audit //docs/...
      - name: Store Test Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-logs
          path: material.angular.dev/bazel-testlogs/
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6a54b1f6636c00be7b9c3fa5928da87df48ff9a0 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Execute Lighthouse Audit
        run: pnpm -s bazel test --test_tag_filters=audit //docs/...
      - name: Store Audit Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-logs
          path: material.angular.dev/bazel-testlogs/
          retention-days: 14
